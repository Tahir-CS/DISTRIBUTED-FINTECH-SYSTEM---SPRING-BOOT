spring:
  datasource:
    url: jdbc:h2:mem:ledger_db
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  # Base64 encoded secret key for HMAC-SHA256 (Needs to be at least 256 bits)
  # "my-super-secret-key-that-is-at-least-256-bits-long-for-jwt-signing" base64 encoded:
  secret: bXktc3VwZXItc2VjcmV0LWtleS10aGF0LWlzLWF0LWxlYXN0LTI1Ni1iaXRzLWxvbmctZm9yLWp3dC1zaWduaW5n
  expiration: 86400000
